name: chart
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["charts/**", ".github/workflows/chart.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/benchme
      - run: helm template benchme charts/benchme --namespace benchme > /dev/null
  publish:
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: package with the tag's version and matching app image tags
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          helm package charts/benchme --version "$VERSION" --app-version "$VERSION" -d out
          helm push "out/benchme-$VERSION.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts
