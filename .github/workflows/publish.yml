name: publish
# Publishes the public @benchme packages to npm on a version tag (vX.Y.Z), with
# provenance (the repository is public; npm rejects attestations from a private
# source repo with E422). Needs the NPM_TOKEN repository secret (an npm
# granular access token with publish rights on the @benchme scope). Apps are
# never published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to publish (an existing vX.Y.Z tag is checked out)"
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      - run: npx tsc -b tsconfig.build.json
      - name: version every package from the tag
        # Plain package.json edits — `npm version -w` re-resolves the workspace
        # graph and looks the OLD @benchme/* versions up in the registry (404 on
        # a first publish), so the versions are written directly: every package
        # gets the tag's version and every @benchme/* dependency points at it.
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const fs=require("fs"); const V=process.argv[1];
            for (const p of ["core","scenarios","site-kit"]) {
              const f=`packages/${p}/package.json`; const j=JSON.parse(fs.readFileSync(f));
              j.version=V;
              for (const k of Object.keys(j.dependencies||{})) if (k.startsWith("@benchme/")) j.dependencies[k]=V;
              fs.writeFileSync(f, JSON.stringify(j,null,2)+"\n");
            }' "${VERSION:-${GITHUB_REF_NAME#v}}"
          git diff --stat -- packages/*/package.json
      - name: publish (core → scenarios → site-kit)
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for p in core scenarios site-kit; do
            npm publish -w "packages/$p" --provenance --access public
          done
      - name: not published — NPM_TOKEN is not configured
        if: env.NPM_TOKEN == ''
        run: |
          echo "::warning::NPM_TOKEN repository secret is missing — the @benchme packages were versioned and dry-run only. Add the secret and re-run this workflow (workflow_dispatch with the version) to publish."
          for p in core scenarios site-kit; do npm publish --dry-run -w "packages/$p" --access public; done
