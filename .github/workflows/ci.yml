name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: benchme, POSTGRES_USER: benchme, POSTGRES_DB: benchme }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U benchme" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://benchme:benchme@localhost:5432/benchme
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The intent corpus's answer keys ARE the generator's output — never hand-edited.
      - run: node tools/intent-corpus.mjs --check
      # The compose stack is a supported way to run benchme: keep it parseable.
      - run: docker compose -f compose.yaml -f compose.build.yaml config -q

  # Every intent task proven against THIS commit's apps (built from source,
  # compose/specs mounted into the verifier): each state task fails on a fresh
  # workspace and passes after its reference solution; each json task accepts
  # the answer read back from the live apps and refuses a wrong one.
  # The stores the same way, on their public fixtures (compose's default
  # scenario file, fake payments): each store takes a campaign code through
  # urls.apps.<store>; each fixture fails fresh, its reference run checks out
  # through the pages into its class, its wrong run into its own — order-number
  # suffixes checked with compose's local suffix key.
  intent-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b tsconfig.build.json
      - run: docker compose -f compose.yaml -f compose.build.yaml up -d --build --wait
        env: { RUNNER_KIND: none }
      - run: node tools/intent-integrity.mjs --base http://localhost:8080
      # Cards from the wallet stand-in, as agents get theirs: the fixture that pays above its approval runs too.
      - run: node tools/checkout-integrity.mjs --base http://localhost:8080 --fixtures --wallet --suffix-key benchme-local-suffix-key-change-me
      # The real @stripe/link-cli (npm, unmodified) against the wallet, in its CLI and MCP modes.
      - run: node tools/link-cli-contract.mjs --base http://localhost:8080
        env: { WALLET_INTERNAL_SECRET: benchme-local-wallet-secret-change-me, OPERATOR_KEY: benchme-local-operator-key-change-me }
      - if: failure()
        run: docker compose logs --tail 200
