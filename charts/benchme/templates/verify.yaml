{{- /*
The verifier runs submitted patches as isolated Jobs in this namespace:
  - its own ServiceAccount + Role limited to jobs/configmaps/pods (+ pod logs)
  - a runner ServiceAccount with NO permissions, given to runner pods
  - a NetworkPolicy denying ALL egress from runner pods (no network in the sandbox)
  - the hidden task specs, mounted read-only at /specs from a ConfigMap
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-verify
  labels:
    {{- include "benchme.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-runner
  labels:
    {{- include "benchme.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-verify
  labels:
    {{- include "benchme.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-verify
  labels:
    {{- include "benchme.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-verify
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-verify
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-runner-no-egress
  labels:
    {{- include "benchme.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      benchme.dev/role: runner
  policyTypes: [Egress]
  egress: []
{{- if not .Values.verify.existingSpecsConfigMap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-task-specs
  labels:
    {{- include "benchme.labels" . | nindent 4 }}
data:
  {{- range $id, $spec := .Values.verify.specs }}
  {{ $id }}.json: {{ toJson $spec | quote }}
  {{- end }}
{{- end }}
