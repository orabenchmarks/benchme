{{- /* Stripe runs in test mode only: a live key never reaches a Secret. */}}
{{- range $key := list "stripeSecretKey" "stripePublishableKey" }}
  {{- if regexMatch "^(sk|pk|rk)_live_" (index $.Values.secrets $key | default "" | toString) }}
    {{- fail (printf "secrets.%s is a live Stripe key — benchme runs Stripe in test mode only" $key) }}
  {{- end }}
{{- end }}
{{- if not .Values.secrets.existingSecret }}
{{- $name := printf "%s-secrets" .Release.Name }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $data := dict }}
{{- if $existing }}{{ $data = $existing.data }}{{ end }}
{{- $pick := dict }}
{{- range $key := list "gatewaySecret" "operatorKey" "receiptSecret" "mailInternalSecret" "postgresPassword" "shopsSuffixKey" "shopsInternalSecret" "walletInternalSecret" }}
  {{- $explicit := index $.Values.secrets $key }}
  {{- if $explicit }}
    {{- $_ := set $pick $key ($explicit | b64enc) }}
  {{- else if hasKey $data $key }}
    {{- $_ := set $pick $key (index $data $key) }}
  {{- else }}
    {{- $_ := set $pick $key (randAlphaNum 40 | b64enc) }}
  {{- end }}
{{- end }}
{{- /* llm/jev ranker provider credentials and the Stripe test keys: NEVER
       auto-generated (a random string is not a valid API key) — explicit
       value, the value kept from a prior release, or empty (the default
       lexical ranker and shops.payments=fake need none of them). */}}
{{- range $key := list "llmApiKey" "jevApiKey" "stripeSecretKey" "stripePublishableKey" }}
  {{- $explicit := index $.Values.secrets $key }}
  {{- if $explicit }}
    {{- $_ := set $pick $key ($explicit | b64enc) }}
  {{- else if hasKey $data $key }}
    {{- $_ := set $pick $key (index $data $key) }}
  {{- else }}
    {{- $_ := set $pick $key ("" | b64enc) }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "benchme.labels" . | nindent 4 }}
  annotations:
    # Generated once, then kept across upgrades (lookup above) so sessions,
    # receipts and the database password survive a chart upgrade.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $k, $v := $pick }}
  {{ $k }}: {{ $v }}
  {{- end }}
{{- end }}
