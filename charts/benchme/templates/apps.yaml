{{- $root := . }}
{{- $internal := .Values.internalBaseUrl | default (printf "http://%s-gateway.%s.svc.cluster.local" .Release.Name .Release.Namespace) }}
{{- range $app, $cfg := .Values.apps }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-{{ $app }}
  labels:
    {{- include "benchme.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $app }}
spec:
  selector:
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-{{ $app }}
  labels:
    {{- include "benchme.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $app }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $app }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $app }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/part-of: benchme
      annotations:
        # Roll the pods when the generated/explicit secrets change.
        checksum/values: {{ toYaml $root.Values.secrets | sha256sum }}
    spec:
      {{- include "benchme.scheduling" $root | nindent 6 }}
      {{- include "benchme.pullSecrets" $root | nindent 6 }}
      {{- if eq $app "verify" }}
      serviceAccountName: {{ $root.Release.Name }}-verify
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: {{ $app }}
          image: {{ include "benchme.image" (dict "root" $root "app" $app) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            {{- include "benchme.commonEnv" $root | nindent 12 }}
            {{- if eq $app "gateway" }}
            - name: REDIS_URL
              value: redis://{{ $root.Release.Name }}-redis:6379
            - name: OPERATOR_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "benchme.secretName" $root }}
                  key: operatorKey
            - name: RECEIPT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "benchme.secretName" $root }}
                  key: receiptSecret
            - name: PUBLIC_BASE_URL
              value: {{ $root.Values.publicBaseUrl | quote }}
            - name: INTERNAL_BASE_URL
              value: {{ $internal | quote }}
            # The store sites are one app (shops) serving each site under /s/<site>.
            - name: APP_TARGETS
              value: {{ printf "{\"warehouse\":\"http://%s-warehouse\",\"helpdesk\":\"http://%s-helpdesk\",\"vaultdocs\":\"http://%s-vaultdocs\",\"mail\":\"http://%s-mail\",\"data\":\"http://%s-data\",\"verify\":\"http://%s-verify\",\"wrenfield\":\"http://%s-shops/s/wrenfield\",\"halden\":\"http://%s-shops/s/halden\",\"quillfeather\":\"http://%s-shops/s/quillfeather\",\"paylantern\":\"http://%s-shops/s/paylantern\"}" $root.Release.Name $root.Release.Name $root.Release.Name $root.Release.Name $root.Release.Name $root.Release.Name $root.Release.Name $root.Release.Name $root.Release.Name $root.Release.Name | quote }}
            # Routed like any app, but left out of a workspace's urls.
            - name: UNLISTED_APPS
              value: "paylantern"
            # Served at the root, outside any workspace: /wallet/* (link-cli's LINK_API_BASE_URL = <public>/wallet/api).
            - name: SERVICE_TARGETS
              value: {{ printf "{\"wallet\":\"http://%s-wallet\"}" $root.Release.Name | quote }}
            - name: SEEDED_APPS
              value: "warehouse,helpdesk,vaultdocs,mail,verify"
            - name: MCP_APPS
              value: "warehouse,helpdesk,vaultdocs"
            - name: ASK_APPS
              value: "warehouse,helpdesk,vaultdocs"
            - name: WEBMCP_APPS
              value: "warehouse,helpdesk,vaultdocs"
            - name: WORKSPACE_TTL_SECONDS
              value: {{ $root.Values.workspaces.ttlSeconds | quote }}
            - name: WORKSPACE_MAX_TTL_SECONDS
              value: {{ $root.Values.workspaces.maxTtlSeconds | quote }}
            - name: RATE_CREATE_PER_HOUR
              value: {{ $root.Values.workspaces.rateCreatePerHour | quote }}
            {{- end }}
            {{- if or (eq $app "warehouse") (eq $app "helpdesk") (eq $app "shops") }}
            - name: MAIL_URL
              value: http://{{ $root.Release.Name }}-mail
            {{- end }}
            {{- if eq $app "shops" }}
            - name: SHOPS_PAYMENTS
              value: {{ $root.Values.shops.payments | default "fake" | quote }}
            # Optional: empty (or absent from an existingSecret) under payments=fake.
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.shops.stripeExistingSecret | default (include "benchme.secretName" $root) }}
                  key: stripeSecretKey
                  optional: true
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.shops.stripeExistingSecret | default (include "benchme.secretName" $root) }}
                  key: stripePublishableKey
                  optional: true
            # An order's charge is checked against what the wallet approved (paid above approval).
            - name: WALLET_URL
              value: http://{{ $root.Release.Name }}-wallet
            - name: WALLET_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "benchme.secretName" $root }}
                  key: walletInternalSecret
            - name: SHOPS_SUFFIX_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "benchme.secretName" $root }}
                  key: shopsSuffixKey
            - name: SHOPS_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "benchme.secretName" $root }}
                  key: shopsInternalSecret
            {{- if $root.Values.shops.existingScenariosConfigMap }}
            - name: SHOPS_SCENARIOS_FILE
              value: /scenarios/shops-scenarios.json
            {{- end }}
            {{- end }}
            {{- if eq $app "wallet" }}
            - name: WALLET_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "benchme.secretName" $root }}
                  key: walletInternalSecret
            - name: WALLET_POLICY
              value: {{ $root.Values.wallet.policy | default "lab" | quote }}
            - name: WALLET_APPROVAL_DELAY_MS
              value: {{ $root.Values.wallet.approvalDelayMs | quote }}
            # The stores' origins (public, and in-cluster): a request paying anywhere else is declined.
            - name: WALLET_MERCHANT_ORIGINS
              value: {{ concat (list $root.Values.publicBaseUrl $internal) ($root.Values.wallet.extraMerchantOrigins | default list) | join "," | quote }}
            - name: WALLET_PUBLIC_URL
              value: {{ printf "%s/wallet" (trimSuffix "/" $root.Values.publicBaseUrl) | quote }}
            # Where a request's checkout is looked up (the stores' internal API).
            - name: SHOPS_URL
              value: http://{{ $root.Release.Name }}-shops
            - name: SHOPS_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "benchme.secretName" $root }}
                  key: shopsInternalSecret
            {{- end }}
            {{- if eq $app "verify" }}
            - name: RECEIPT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "benchme.secretName" $root }}
                  key: receiptSecret
            - name: SPECS_DIR
              value: /specs
            # The `state` oracle reads a workspace's live app state straight from these (never through the gateway proxy).
            - name: APP_TARGETS
              value: {{ printf "{\"warehouse\":\"http://%s-warehouse\",\"helpdesk\":\"http://%s-helpdesk\",\"vaultdocs\":\"http://%s-vaultdocs\",\"mail\":\"http://%s-mail\",\"data\":\"http://%s-data\"}" $root.Release.Name $root.Release.Name $root.Release.Name $root.Release.Name $root.Release.Name | quote }}
            - name: MAX_ATTEMPTS_PER_TASK
              value: {{ $root.Values.verify.maxAttemptsPerTask | quote }}
            - name: MAX_ARTIFACT_BYTES
              value: {{ $root.Values.verify.maxArtifactBytes | quote }}
            - name: RUNNER_NAMESPACE
              value: {{ $root.Release.Namespace | quote }}
            - name: RUNNER_SERVICE_ACCOUNT
              value: {{ $root.Release.Name }}-runner
            - name: RUNNER_LABEL
              value: runner
            - name: RUNNER_CPU
              value: {{ $root.Values.verify.runner.cpu | quote }}
            - name: RUNNER_MEMORY
              value: {{ $root.Values.verify.runner.memory | quote }}
            - name: RUNNER_NODE_SELECTOR
              value: {{ $root.Values.scheduling.nodeSelector | toJson | quote }}
            - name: RUNNER_TOLERATIONS
              value: {{ $root.Values.scheduling.tolerations | toJson | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          securityContext:
            {{- include "benchme.securityContext" $root | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq $app "verify" }}
            - name: specs
              mountPath: /specs
              readOnly: true
            {{- end }}
            {{- if and (eq $app "shops") $root.Values.shops.existingScenariosConfigMap }}
            - name: scenarios
              mountPath: /scenarios
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq $app "verify" }}
        - name: specs
          configMap:
            name: {{ $root.Values.verify.existingSpecsConfigMap | default (printf "%s-task-specs" $root.Release.Name) }}
        {{- end }}
        {{- if and (eq $app "shops") $root.Values.shops.existingScenariosConfigMap }}
        - name: scenarios
          configMap:
            name: {{ $root.Values.shops.existingScenariosConfigMap }}
        {{- end }}
{{- end }}
