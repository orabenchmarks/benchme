# benchme chart values. Install into its OWN namespace:
#   helm install benchme oci://ghcr.io/orabenchmarks/charts/benchme -n benchme --create-namespace
image:
  registry: ghcr.io/orabenchmarks
  # Defaults to the chart's appVersion; set to a sha-… tag for a pre-release build.
  tag: ""
  pullPolicy: IfNotPresent
  # Names of existing docker-registry Secrets in the release namespace. Empty
  # when the GHCR packages are public (the intended posture).
  pullSecrets: []

ingress:
  enabled: true
  className: traefik
  # The ONE public host (path-routed apps underneath).
  host: benchme.localhost
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# How the outside reaches the gateway (drives the URLs a workspace returns).
publicBaseUrl: http://benchme.localhost
# How pods inside the cluster reach it (harness pods; defaults to the gateway Service).
internalBaseUrl: ""

workspaces:
  ttlSeconds: 86400
  maxTtlSeconds: 604800
  rateCreatePerHour: 10
  reaper:
    schedule: "*/15 * * * *"

# Secrets are generated on first install and kept across upgrades (lookup),
# or supplied explicitly here / via existingSecret.
secrets:
  existingSecret: ""
  gatewaySecret: ""
  operatorKey: ""
  receiptSecret: ""
  mailInternalSecret: ""
  postgresPassword: ""

postgres:
  image: postgres:16
  storage: 5Gi
  storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

redis:
  image: redis:7-alpine
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

apps:
  gateway:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
  warehouse:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
  helpdesk:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
  vaultdocs:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
  mail:
    replicas: 1
    resources:
      requests: { cpu: 25m, memory: 96Mi }
      limits: { cpu: 300m, memory: 256Mi }
  data:
    replicas: 1
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { cpu: 300m, memory: 256Mi }
  verify:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: "1", memory: 768Mi }

verify:
  maxAttemptsPerTask: 20
  maxArtifactBytes: 10485760
  runner:
    cpu: "2"
    memory: 2Gi
  # Hidden task specs (taskId → spec object), rendered into a ConfigMap at
  # /specs. Production supplies them from benchme-hidden through a values
  # file that is never committed here; dev ships a couple of smoke specs.
  specs: {}

logLevel: info

# Scheduling isolation. Staging/production pin EVERY benchme workload — apps,
# postgres, redis, the migrate/reaper jobs AND the verifier's runner Jobs — to
# a dedicated node pool (nodeSelector + toleration for its taint) so benchmark
# load can never compete with the platform's own services. Dev leaves both empty.
scheduling:
  nodeSelector: {}
  tolerations: []

# A hard ceiling on what the namespace may request in total (a second guard on
# top of the node pool). Empty = no quota object.
resourceQuota:
  enabled: false
  requests:
    cpu: "16"
    memory: 48Gi
  limits:
    cpu: "48"
    memory: 96Gi
  pods: "120"
