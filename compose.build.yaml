# Build the images from this checkout instead of pulling them:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
# The migrate-* and reaper services reuse the images the app services build.
services:
  gateway:
    build: { context: ., dockerfile: docker/app.Dockerfile, args: { APP: gateway } }
  warehouse:
    build: { context: ., dockerfile: docker/app.Dockerfile, args: { APP: warehouse } }
  helpdesk:
    build: { context: ., dockerfile: docker/app.Dockerfile, args: { APP: helpdesk } }
  vaultdocs:
    build: { context: ., dockerfile: docker/app.Dockerfile, args: { APP: vaultdocs } }
  mail:
    build: { context: ., dockerfile: docker/app.Dockerfile, args: { APP: mail } }
  data:
    build: { context: ., dockerfile: docker/app.Dockerfile, args: { APP: data } }
  verify:
    build: { context: ., dockerfile: docker/app.Dockerfile, args: { APP: verify } }
