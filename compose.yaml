# benchme on one machine: `docker compose up -d` → http://localhost:8080
#
# Same topology as the Helm chart: one Postgres, one Redis, an ordered
# migration chain, the gateway (the only published port), the sites, the
# verifier and an hourly reaper. Images come from ghcr.io/orabenchmarks at
# BENCHME_VERSION; `-f compose.yaml -f compose.build.yaml up --build` builds
# them from this checkout instead. Every setting below has a LOCAL default —
# copy .env.example to .env to change them (and change every secret before
# exposing this to anyone but yourself).
#
# Code tasks: the verifier runs each submitted patch in a sibling container
# through the Docker socket (RUNNER_KIND=docker) — no network, capabilities
# dropped, memory/CPU limits, removed afterwards. Mounting the socket gives the
# verifier container control of your Docker daemon; set RUNNER_KIND=none in
# .env and drop the socket mount to refuse that (code tasks then FAIL with a
# note; document, json and calc oracles keep working).
name: benchme


x-common-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://benchme:${POSTGRES_PASSWORD:-benchme-local-postgres}@postgres:5432/benchme
  GATEWAY_SECRET: ${GATEWAY_SECRET:-benchme-local-gateway-secret-change-me}
  MAIL_INTERNAL_SECRET: ${MAIL_INTERNAL_SECRET:-benchme-local-mail-secret-change-me}
  # Which ranker warehouse/helpdesk/vaultdocs run behind /ask, and its
  # credentials — see rankerEnvSchema in
  # packages/site-kit/src/nlweb/ranker-config.ts (the schema these defaults
  # mirror). A key missing for the SELECTED ranker is a boot failure, not a
  # silent fall-back to lexical — see README § Rankers.
  ASK_RANKER: ${ASK_RANKER:-lexical}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5-20251001}
  LLM_INPUT_USD_PER_MTOK: ${LLM_INPUT_USD_PER_MTOK:-1.0}
  LLM_OUTPUT_USD_PER_MTOK: ${LLM_OUTPUT_USD_PER_MTOK:-5.0}
  JEV_BASE_URL: ${JEV_BASE_URL:-https://api.typesafe.ai}
  JEV_API_KEY: ${JEV_API_KEY:-}
  JEV_MODEL: ${JEV_MODEL:-jev-latest}
  RANKER_CONCURRENCY: ${RANKER_CONCURRENCY:-8}
  # Enables an X-Ask-Ranker per-request override on /ask — evaluations only
  # (tools/ask-eval.mjs), so one deployment can be scored across every ranker
  # without a restart. Unset (0) ignores the header entirely.
  ASK_RANKER_OVERRIDE: ${ASK_RANKER_OVERRIDE:-0}

x-app: &app
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  # The last migration of the chain below.
  depends_on:
    migrate-wallet:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

x-migrate: &migrate
  restart: "no"
  environment: *common-env

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: benchme
      POSTGRES_DB: benchme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benchme-local-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchme -d benchme"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # The chart's migrate Job: one app after another, in this order.
  migrate-gateway:
    <<: *migrate
    image: ghcr.io/orabenchmarks/gateway:${BENCHME_VERSION:-0.7.1}
    command: ["node", "apps/gateway/dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
  migrate-warehouse:
    <<: *migrate
    image: ghcr.io/orabenchmarks/warehouse:${BENCHME_VERSION:-0.7.1}
    command: ["node", "apps/warehouse/dist/migrate.js"]
    depends_on:
      migrate-gateway:
        condition: service_completed_successfully
  migrate-helpdesk:
    <<: *migrate
    image: ghcr.io/orabenchmarks/helpdesk:${BENCHME_VERSION:-0.7.1}
    command: ["node", "apps/helpdesk/dist/migrate.js"]
    depends_on:
      migrate-warehouse:
        condition: service_completed_successfully
  migrate-vaultdocs:
    <<: *migrate
    image: ghcr.io/orabenchmarks/vaultdocs:${BENCHME_VERSION:-0.7.1}
    command: ["node", "apps/vaultdocs/dist/migrate.js"]
    depends_on:
      migrate-helpdesk:
        condition: service_completed_successfully
  migrate-mail:
    <<: *migrate
    image: ghcr.io/orabenchmarks/mail:${BENCHME_VERSION:-0.7.1}
    command: ["node", "apps/mail/dist/migrate.js"]
    depends_on:
      migrate-vaultdocs:
        condition: service_completed_successfully
  migrate-verify:
    <<: *migrate
    image: ghcr.io/orabenchmarks/verify:${BENCHME_VERSION:-0.7.1}
    command: ["node", "apps/verify/dist/migrate.js"]
    depends_on:
      migrate-mail:
        condition: service_completed_successfully
  migrate-shops:
    <<: *migrate
    image: ghcr.io/orabenchmarks/shops:${BENCHME_VERSION:-0.7.1}
    command: ["node", "apps/shops/dist/migrate.js"]
    depends_on:
      migrate-verify:
        condition: service_completed_successfully
  migrate-wallet:
    <<: *migrate
    image: ghcr.io/orabenchmarks/wallet:${BENCHME_VERSION:-0.7.1}
    command: ["node", "apps/wallet/dist/migrate.js"]
    depends_on:
      migrate-shops:
        condition: service_completed_successfully

  gateway:
    <<: *app
    image: ghcr.io/orabenchmarks/gateway:${BENCHME_VERSION:-0.7.1}
    ports:
      - "${BENCHME_PORT:-8080}:3000"
    depends_on:
      migrate-wallet:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      <<: *common-env
      REDIS_URL: redis://redis:6379
      OPERATOR_KEY: ${OPERATOR_KEY:-benchme-local-operator-key-change-me}
      RECEIPT_SECRET: ${RECEIPT_SECRET:-benchme-local-receipt-secret-change-me}
      PUBLIC_BASE_URL: ${BENCHME_PUBLIC_URL:-http://localhost:8080}
      INTERNAL_BASE_URL: http://gateway:3000
      # The store sites are one app (shops) serving each site under /s/<site>. wallet: the wallet's
      # workspace-scoped door (/w/<id>/wallet/card → wallet:3000/workspace/card, the saved card of a run that
      # pays without Link) — the same service the root /wallet/* reaches, which forwards no workspace.
      APP_TARGETS: '{"warehouse":"http://warehouse:3000","helpdesk":"http://helpdesk:3000","vaultdocs":"http://vaultdocs:3000","mail":"http://mail:3000","data":"http://data:3000","verify":"http://verify:3000","wrenfield":"http://shops:3000/s/wrenfield","halden":"http://shops:3000/s/halden","quillfeather":"http://shops:3000/s/quillfeather","paylantern":"http://shops:3000/s/paylantern","wallet":"http://wallet:3000/workspace"}'
      # Routed like any app, but left out of a workspace's urls (and the portal, the registry, robots.txt).
      UNLISTED_APPS: paylantern,wallet
      # Served at the root, outside any workspace: /wallet/* (link-cli's LINK_API_BASE_URL = <public>/wallet/api).
      SERVICE_TARGETS: '{"wallet":"http://wallet:3000"}'
      SEEDED_APPS: warehouse,helpdesk,vaultdocs,mail,verify
      MCP_APPS: warehouse,helpdesk,vaultdocs
      ASK_APPS: warehouse,helpdesk,vaultdocs
      WEBMCP_APPS: warehouse,helpdesk,vaultdocs
      WORKSPACE_TTL_SECONDS: ${WORKSPACE_TTL_SECONDS:-86400}
      WORKSPACE_MAX_TTL_SECONDS: ${WORKSPACE_MAX_TTL_SECONDS:-604800}
      # Your own machine: no need to throttle yourself.
      RATE_CREATE_PER_HOUR: ${RATE_CREATE_PER_HOUR:-1000}

  warehouse:
    <<: *app
    image: ghcr.io/orabenchmarks/warehouse:${BENCHME_VERSION:-0.7.1}
    environment:
      <<: *common-env
      MAIL_URL: http://mail:3000

  helpdesk:
    <<: *app
    image: ghcr.io/orabenchmarks/helpdesk:${BENCHME_VERSION:-0.7.1}
    environment:
      <<: *common-env
      MAIL_URL: http://mail:3000

  vaultdocs:
    <<: *app
    image: ghcr.io/orabenchmarks/vaultdocs:${BENCHME_VERSION:-0.7.1}
    environment: *common-env

  mail:
    <<: *app
    image: ghcr.io/orabenchmarks/mail:${BENCHME_VERSION:-0.7.1}
    environment: *common-env

  data:
    <<: *app
    image: ghcr.io/orabenchmarks/data:${BENCHME_VERSION:-0.7.1}
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}

  # The stores (README § Stores): wrenfield, halden, quillfeather and the
  # paylantern page, all from one app under /s/<site>.
  shops:
    <<: *app
    image: ghcr.io/orabenchmarks/shops:${BENCHME_VERSION:-0.7.1}
    environment:
      <<: *common-env
      MAIL_URL: http://mail:3000
      # fake (settled in-process, no Stripe) | stripe (both keys below, TEST
      # mode only — the app refuses to boot on a live key).
      SHOPS_PAYMENTS: ${SHOPS_PAYMENTS:-fake}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      SHOPS_SUFFIX_KEY: ${SHOPS_SUFFIX_KEY:-benchme-local-suffix-key-change-me}
      SHOPS_INTERNAL_SECRET: ${SHOPS_INTERNAL_SECRET:-benchme-local-shops-secret-change-me}
      # Campaign code → scenario. The default directory holds the public
      # fixtures; point SHOPS_SCENARIOS_DIR at the hidden config's directory.
      SHOPS_SCENARIOS_FILE: /scenarios/shops-scenarios.json
      # An order's charge is checked against what the wallet approved (paid above approval).
      WALLET_URL: http://wallet:3000
      WALLET_INTERNAL_SECRET: ${WALLET_INTERNAL_SECRET:-benchme-local-wallet-secret-change-me}
    volumes:
      - ${SHOPS_SCENARIOS_DIR:-./apps/shops/test-fixtures}:/scenarios:ro

  # The Link wallet stand-in (README § Wallet): the HTTP API @stripe/link-cli
  # calls, at <public>/wallet/api and <public>/wallet/auth through the gateway.
  wallet:
    <<: *app
    image: ghcr.io/orabenchmarks/wallet:${BENCHME_VERSION:-0.7.1}
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://benchme:${POSTGRES_PASSWORD:-benchme-local-postgres}@postgres:5432/benchme
      WALLET_INTERNAL_SECRET: ${WALLET_INTERNAL_SECRET:-benchme-local-wallet-secret-change-me}
      # The gateway's secret: the card-on-file door (/w/<id>/wallet/card) trusts the workspace it signs.
      GATEWAY_SECRET: ${GATEWAY_SECRET:-benchme-local-gateway-secret-change-me}
      # lab (approve requests paying the stores, with the card the bound scenario
      # calls for) | decline-all (the Field study: every request declined).
      WALLET_POLICY: ${WALLET_POLICY:-lab}
      # The stores' origin: a request paying anywhere else is declined.
      WALLET_MERCHANT_ORIGINS: ${BENCHME_PUBLIC_URL:-http://localhost:8080}
      # Hosted payment pages (Halden pays on Stripe Checkout): approved only when bound by the page's Checkout Session.
      WALLET_HOSTED_CHECKOUT_ORIGINS: https://checkout.stripe.com
      WALLET_APPROVAL_DELAY_MS: ${WALLET_APPROVAL_DELAY_MS:-2000}
      # Where a request's checkout is looked up (the stores' internal API).
      SHOPS_URL: http://shops:3000
      SHOPS_INTERNAL_SECRET: ${SHOPS_INTERNAL_SECRET:-benchme-local-shops-secret-change-me}

  verify:
    <<: *app
    image: ghcr.io/orabenchmarks/verify:${BENCHME_VERSION:-0.7.1}
    # The Docker socket's group so the non-root verifier may use it:
    # Linux → `stat -c %g /var/run/docker.sock`; Docker Desktop → 0.
    group_add:
      - "${DOCKER_GID:-0}"
    environment:
      <<: *common-env
      RECEIPT_SECRET: ${RECEIPT_SECRET:-benchme-local-receipt-secret-change-me}
      SPECS_DIR: /specs
      MAX_ATTEMPTS_PER_TASK: ${MAX_ATTEMPTS_PER_TASK:-20}
      # The `state` oracle reads a workspace's live app state straight from these (never through the gateway proxy).
      APP_TARGETS: '{"warehouse":"http://warehouse:3000","helpdesk":"http://helpdesk:3000","vaultdocs":"http://vaultdocs:3000","mail":"http://mail:3000","data":"http://data:3000"}'
      RUNNER_KIND: ${RUNNER_KIND:-docker}
      DOCKER_HOST: unix:///var/run/docker.sock
      RUNNER_CPU: ${RUNNER_CPU:-2}
      RUNNER_MEMORY: ${RUNNER_MEMORY:-2Gi}
    volumes:
      - ./compose/specs:/specs:ro
      - /var/run/docker.sock:/var/run/docker.sock

  # The chart's reaper CronJob: expired workspaces are dropped every hour.
  reaper:
    image: ghcr.io/orabenchmarks/gateway:${BENCHME_VERSION:-0.7.1}
    restart: unless-stopped
    depends_on:
      migrate-wallet:
        condition: service_completed_successfully
    environment: *common-env
    command: ["sh", "-c", "while true; do node apps/gateway/dist/reap.js; sleep ${REAP_INTERVAL_SECONDS:-3600}; done"]

volumes:
  pgdata:
